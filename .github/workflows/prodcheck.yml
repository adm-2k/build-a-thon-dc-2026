# prodcheck — external production probe (orchestrator tooling).
#
# Why this exists: the build machine's network (Cisco Umbrella) blocks
# *.vercel.app outright, so "the deployed URL still loads after merge"
# (CLAUDE.md definition of done, ORCHESTRATION §6) cannot be verified
# locally. This workflow probes production from a GitHub runner instead.
#
# Runs on manual dispatch and automatically ~90s after every push to main
# (one Vercel build cycle). It never blocks a merge by itself — A reads the
# result as the post-merge gate.
name: prodcheck
on:
  workflow_dispatch:
    inputs:
      url:
        description: Production base URL
        required: false
        default: https://build-a-thon-dc-2026-adm-2ks-projects.vercel.app
  push:
    branches: [main]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: wait one Vercel build cycle (push only)
        if: github.event_name == 'push'
        run: sleep 90
      - name: probe hub + health
        run: |
          BASE="${{ github.event.inputs.url || 'https://build-a-thon-dc-2026-adm-2ks-projects.vercel.app' }}"
          # While Vercel Deployment Protection is ON, production answers 302
          # to vercel.com SSO for EVERY path. That still proves the deployment
          # is aliased and serving — report DEPLOYED-BUT-WALLED and pass.
          # Once A toggles protection off, the full 200 + content gate applies.
          fail=0; walled=1
          for path in / /api/health /scriptorium /tracer /map /network /begriffs; do
            for i in 1 2 3 4 5; do
              code=$(curl -s -o body.out -w '%{http_code}' --max-time 20 "$BASE$path")
              [ "$code" = "200" ] || [ "$code" = "302" ] && break
              sleep 20
            done
            echo "== $BASE$path → HTTP $code"
            if [ "$code" != "302" ]; then walled=0; fi
            if [ "$code" != "200" ] && [ "$code" != "302" ]; then head -c 300 body.out; echo; fail=1; fi
          done
          if [ "$walled" = "1" ]; then
            echo "NOTICE: every path 302s to Vercel Authentication — DEPLOYED-BUT-WALLED."
            echo "Toggle Vercel → Settings → Deployment Protection off for a public URL."
            exit 0
          fi
          # unwalled: the hub must actually be the hub
          code=$(curl -s -L -o hub.out -w '%{http_code}' --max-time 20 "$BASE/")
          if ! grep -qiE 'apparatus' hub.out; then
            echo "FAIL: / did not render the Apparatus hub"; fail=1
          fi
          if ! curl -s -L --max-time 20 "$BASE/api/health" | grep -q 'IN REGISTER'; then
            echo "FAIL: /api/health did not answer IN REGISTER"; fail=1
          fi
          exit $fail
