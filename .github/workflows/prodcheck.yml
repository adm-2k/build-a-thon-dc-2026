# prodcheck — external production probe (orchestrator tooling).
#
# Why this exists: the build machine's network (Cisco Umbrella) blocks
# *.vercel.app outright, so "the deployed URL still loads after merge"
# (CLAUDE.md definition of done, ORCHESTRATION §6) cannot be verified
# locally. This workflow probes production from a GitHub runner instead.
#
# Runs on manual dispatch and automatically ~90s after every push to main
# (one Vercel build cycle). It never blocks a merge by itself — A reads the
# result as the post-merge gate.
name: prodcheck
on:
  workflow_dispatch:
    inputs:
      url:
        description: Production base URL
        required: false
        default: https://build-a-thon-dc-2026.vercel.app
  push:
    branches: [main]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: wait one Vercel build cycle (push only)
        if: github.event_name == 'push'
        run: sleep 90
      - name: probe hub + health
        run: |
          BASE="${{ github.event.inputs.url || 'https://build-a-thon-dc-2026.vercel.app' }}"
          fail=0
          for path in / /api/health /tracer /map; do
            for i in 1 2 3 4 5; do
              code=$(curl -s -o body.out -w '%{http_code}' --max-time 20 "$BASE$path") && [ "$code" = "200" ] && break
              sleep 20
            done
            echo "== $BASE$path → HTTP $code"
            head -c 300 body.out; echo
            if [ "$code" != "200" ]; then fail=1; fi
          done
          # the hub must actually be the hub, not a placeholder or wall
          code=$(curl -s -o hub.out -w '%{http_code}' --max-time 20 "$BASE/")
          if ! grep -qiE 'apparatus' hub.out; then
            echo "FAIL: / did not render the Apparatus hub"; fail=1
          fi
          if ! curl -s --max-time 20 "$BASE/api/health" | grep -q 'IN REGISTER'; then
            echo "FAIL: /api/health did not answer IN REGISTER"; fail=1
          fi
          exit $fail
